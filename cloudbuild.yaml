steps:
    # Build backend image
    - name: "gcr.io/cloud-builders/docker"
      args:
          [
              "build",
              "-t",
              "gcr.io/$PROJECT_ID/spotify-backend:$SHORT_SHA",
              "-t",
              "gcr.io/$PROJECT_ID/spotify-backend:latest",
              "./backend",
          ]

    # Push backend image
    - name: "gcr.io/cloud-builders/docker"
      args: ["push", "gcr.io/$PROJECT_ID/spotify-backend:$SHORT_SHA"]

    # Deploy to Cloud Run with secrets
    - name: "gcr.io/cloud-builders/run"
      args:
          - deploy
          - spotify-backend
          - --image=gcr.io/$PROJECT_ID/spotify-backend:$SHORT_SHA
          - --region=us-central1
          - --platform=managed
          - --allow-unauthenticated
          - --memory=512Mi
          - --cpu=1
          - --update-secrets=MONGODB_URI=mongodb-uri:latest,CLERK_SECRET_KEY=clerk-secret-key:latest,CLOUDINARY_CLOUD_NAME=cloudinary-cloud-name:latest,CLOUDINARY_API_KEY=cloudinary-api-key:latest,CLOUDINARY_API_SECRET=cloudinary-api-secret:latest,FRONTEND_URL=frontend-url:latest
          - --set-env-vars=NODE_ENV=production

images:
    - "gcr.io/$PROJECT_ID/spotify-backend:$SHORT_SHA"
    - "gcr.io/$PROJECT_ID/spotify-backend:latest"

timeout: "1800s"
