steps:
    # Build backend image
    - name: "gcr.io/cloud-builders/docker"
      args:
          [
              "build",
              "-t",
              "gcr.io/$PROJECT_ID/spotify-backend:$SHORT_SHA",
              "-t",
              "gcr.io/$PROJECT_ID/spotify-backend:latest",
              "./backend",
          ]

    # Push backend image
    - name: "gcr.io/cloud-builders/docker"
      args: ["push", "gcr.io/$PROJECT_ID/spotify-backend"]

images:
    - "gcr.io/$PROJECT_ID/spotify-backend:$SHORT_SHA"
    - "gcr.io/$PROJECT_ID/spotify-backend:latest"

timeout: "1800s"
